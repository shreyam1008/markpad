<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const root = document.documentElement;
        let saved = {};
        try {
          saved = JSON.parse(localStorage.getItem("markpad-preferences-v1") || "{}");
        } catch {}
        const modes = ["system", "light", "dark"];
        const palettes = ["markpad", "graphite", "nord", "solarized", "rose", "contrast"];
        const mode = modes.includes(saved.themeMode) ? saved.themeMode : "system";
        const appearance =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        root.dataset.appearance = appearance;
        root.dataset.themeMode = mode;
        root.dataset.palette = palettes.includes(saved.palette) ? saved.palette : "markpad";
        root.style.colorScheme = appearance;

        const showBootError = (message) => {
          const status = document.getElementById("boot-status");
          if (status) status.textContent = `Markpad could not start: ${message}`;
        };
        window.addEventListener(
          "error",
          (event) => {
            const source = event.target?.src || event.target?.href;
            showBootError(event.message || (source ? `failed to load ${source}` : "unknown error"));
          },
          true,
        );
        window.addEventListener("unhandledrejection", (event) => {
          showBootError(event.reason?.message || String(event.reason || "unknown error"));
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./src/assets/markpad-mark.svg" />
    <title>Markpad</title>
  </head>
  <body>
    <div id="root">
      <p id="boot-status" style="padding: 24px; font: 14px system-ui; color: #17211f">
        Starting Markpad…
      </p>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
