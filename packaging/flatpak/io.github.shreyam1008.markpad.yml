app-id: io.github.shreyam1008.markpad
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: markpad
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Native GTK chooser uses the document portal; no blanket filesystem grant.
  - --env=GTK_USE_PORTAL=1
modules:
  - name: bun-build-tool
    buildsystem: simple
    build-commands:
      - install -Dm755 bun /app/bin/bun
    cleanup: ['*']
    sources:
      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip
        sha256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
  - name: quillpane
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOPATH: /run/build/quillpane/go
        GOCACHE: /run/build/quillpane/go-cache
        GOPROXY: 'off'
        GOSUMDB: 'off'
        GOTOOLCHAIN: local
        CGO_ENABLED: '1'
    build-commands:
      - cd frontend && bun run build.ts
      - go mod vendor
      - patch -p1 < wails-file-portal.patch
      - go build -mod=vendor -tags 'production,webkit2_41' -trimpath -ldflags='-s -w' -o markpad .
      - install -Dm755 markpad /app/bin/markpad
      - install -Dm644 packaging/linux/markpad.desktop /app/share/applications/io.github.shreyam1008.markpad.desktop
      - desktop-file-edit --set-icon=io.github.shreyam1008.markpad /app/share/applications/io.github.shreyam1008.markpad.desktop
      - install -Dm644 packaging/linux/markpad.svg /app/share/icons/hicolor/scalable/apps/io.github.shreyam1008.markpad.svg
      - install -Dm644 io.github.shreyam1008.markpad.metainfo.xml /app/share/metainfo/io.github.shreyam1008.markpad.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.shreyam1008.markpad/LICENSE
      - >-
        find frontend/node_modules go/pkg/mod -type f
        \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -print0 |
        while IFS= read -r -d '' file; do
        install -Dm644 "$file" "/app/share/licenses/io.github.shreyam1008.markpad/dependencies/$file";
        done
      # Go's extracted module cache is read-only; allow builder cleanup of it.
      - chmod -R u+w go
    sources:
      - type: git
        url: https://github.com/shreyam1008/markpad.git
        tag: v0.13.4
        commit: 0c5469a1b079103e92a43110fbbc8ca7f2d916f3
      - type: file
        path: io.github.shreyam1008.markpad.metainfo.xml
      - type: file
        path: wails-file-portal.patch
      - node-sources.json
      - go-sources.json
