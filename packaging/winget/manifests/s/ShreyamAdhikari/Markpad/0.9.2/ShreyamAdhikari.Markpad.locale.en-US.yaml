ShortDescription: Small native Markdown notepad and local-file viewer
Description: |-
  Markpad is a small native Markdown notepad and local-file viewer built with
  Go, Wails, and the operating system webview. Sessions, drafts, and version
  history stay local, with no account, sync service, or telemetry.

  Features include Markdown editor, split, and preview modes; bounded local
  history and recovery drafts; syntax-highlighted source viewing; command
  palette and keyboard navigation; local image preview; and external PDF
  handoff to the system viewer.
