name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev ripgrep
      - name: Verify
        run: make GO=go check-ci check-size
      - name: Verify tagged version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(./dist/markpad --version)"
          if [ "$actual" != "$expected" ]; then
            echo "tag version $expected does not match application version $actual"
            exit 1
          fi

  linux:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build binary
        run: |
          mkdir -p dist
          go build -tags "production,webkit2_41" -trimpath -ldflags="-s -w" -o dist/markpad .
      - name: Build deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/deb/DEBIAN build/deb/usr/bin build/deb/usr/share/applications build/deb/usr/share/icons/hicolor/scalable/apps build/deb/usr/share/metainfo
          cp dist/markpad build/deb/usr/bin/markpad
          cp packaging/linux/markpad.desktop build/deb/usr/share/applications/markpad.desktop
          cp packaging/linux/markpad.svg build/deb/usr/share/icons/hicolor/scalable/apps/markpad.svg
          cp packaging/linux/io.github.markpad.metainfo.xml build/deb/usr/share/metainfo/io.github.markpad.metainfo.xml
          cat > build/deb/DEBIAN/control <<EOF
          Package: markpad
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Maintainer: Shreyam Adhikari
          Description: Small native Markdown notepad with split view and session restore
          EOF
          sed -i 's/^[[:space:]]*//' build/deb/DEBIAN/control
          dpkg-deb --root-owner-group --build build/deb "dist/markpad_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/markpad
            dist/*.deb

  windows:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      - name: Build exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -tags production -trimpath -ldflags="-s -w -H windowsgui" -o dist/markpad.exe .
      - name: Install NSIS
        shell: pwsh
        run: choco install -y nsis
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content packaging/windows/installer.nsi) -replace '@VERSION@', $version | Set-Content packaging/windows/installer.nsi
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DBASEDIR="$($env:GITHUB_WORKSPACE)" packaging\windows\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      - name: Build app bundle
        env:
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: |
          mkdir -p "dist/Markpad.app/Contents/MacOS" "dist/Markpad.app/Contents/Resources"
          cp packaging/macos/Info.plist "dist/Markpad.app/Contents/Info.plist"
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "dist/Markpad.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "dist/Markpad.app/Contents/Info.plist"
          go build -tags production -trimpath -ldflags="-s -w" -o "dist/Markpad.app/Contents/MacOS/markpad" .
      - name: Build dmg
        env:
          ARTIFACT_ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            hdiutil create -volname Markpad -srcfolder "dist/Markpad.app" -ov -format UDZO "dist/Markpad-macOS-${ARTIFACT_ARCH}.dmg" && break
            echo "hdiutil attempt $i failed, retrying in 5s..."
            sleep 5
          done
      - name: Zip app bundle as fallback
        env:
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: cd dist && zip -r "Markpad-macOS-${ARTIFACT_ARCH}.zip" Markpad.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/Markpad-macOS-${{ matrix.arch }}.dmg
            dist/Markpad-macOS-${{ matrix.arch }}.zip

  publish:
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            **Linux x86-64 (installer script):**
            ```sh
            curl -sL https://raw.githubusercontent.com/shreyam1008/markpad/main/install.sh | sh
            ```

            Or download below:
            - `markpad` — Linux binary; requires GTK 3 and WebKitGTK 4.1
            - `markpad_*_amd64.deb` — Debian/Ubuntu package

            **Windows:** `markpad-setup.exe` — installer with Start Menu + Desktop shortcuts

            **macOS:** choose the `arm64` artifact for Apple silicon or `x86_64` for Intel. Each architecture includes a DMG when creation succeeds and a zipped app fallback.
