name: Publish Cloudflare site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packaging/linux/build-apt-repo.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare authenticated APT repository from stable release
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_KEY_ID: ${{ vars.APT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          mkdir -p apt-dist
          gh release download v0.13.3 --pattern markpad_0.13.3_amd64.deb --dir apt-dist
          echo 'cf7e050f802cd98516c045a617a3eecf1e06352fce1cef3f08fa073572f35409  apt-dist/markpad_0.13.3_amd64.deb' | sha256sum --strict --check -
          test "$(dpkg-deb -f apt-dist/markpad_0.13.3_amd64.deb Package)" = markpad
          bash packaging/linux/build-apt-repo.sh docs/apt apt-dist
          sudo install -m 644 docs/apt/key.gpg /usr/share/keyrings/quillpane-test.gpg
          printf 'deb [signed-by=/usr/share/keyrings/quillpane-test.gpg] file:%s/docs/apt stable main\n' "$GITHUB_WORKSPACE" | sudo tee /etc/apt/sources.list.d/quillpane-test.list
          sudo apt-get update
          sudo apt-get install -y markpad
          dpkg-query -W markpad
          sudo apt-get remove -y markpad
      - name: Publish complete website and signed APT repository for Cloudflare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Publish the exact tested artifact. Signing keys stay in the runner;
          # only the public key, signed metadata and packages enter this branch.
          PAGES_DIR="$RUNNER_TEMP/quillpane-cf-pages"
          mkdir -p "$PAGES_DIR"
          git init "$PAGES_DIR"
          git -C "$PAGES_DIR" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PAGES_DIR" config credential.helper '!gh auth git-credential'
          if git -C "$PAGES_DIR" ls-remote --exit-code --heads origin cf-pages >/dev/null 2>&1; then
            git -C "$PAGES_DIR" fetch --depth 1 origin cf-pages
            git -C "$PAGES_DIR" checkout -b cf-pages FETCH_HEAD
          else
            git -C "$PAGES_DIR" checkout --orphan cf-pages
          fi
          rsync -a --delete --exclude '.git/' docs/ "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"
          git -C "$PAGES_DIR" config user.name 'github-actions[bot]'
          git -C "$PAGES_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PAGES_DIR" add -A
          if ! git -C "$PAGES_DIR" diff --cached --quiet; then
            git -C "$PAGES_DIR" commit -m "site: publish ${GITHUB_SHA::7} with signed APT repository"
            git -C "$PAGES_DIR" push origin cf-pages
          fi
      - name: Verify anonymous HTTPS APT installation
        run: |
          set -euo pipefail
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 -o key.asc https://quillpane.shreyam1008.com.np/apt/key.asc
          gpg --show-keys --with-colons key.asc | grep -q 'fpr:::::::::35B80DDD8D3781FD3781FE188EEFA506FAF81409:'
          sudo install -m 644 key.asc /usr/share/keyrings/quillpane.asc
          sudo rm /etc/apt/sources.list.d/quillpane-test.list
          echo 'deb [signed-by=/usr/share/keyrings/quillpane.asc] https://quillpane.shreyam1008.com.np/apt stable main' | sudo tee /etc/apt/sources.list.d/quillpane.list
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y markpad=0.13.3
          dpkg-query -W markpad
          sudo apt-get remove -y markpad
