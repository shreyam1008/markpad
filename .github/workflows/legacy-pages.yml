name: Restore legacy website redirects
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packaging/legacy-site/**', '.github/workflows/legacy-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: legacy-github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/legacy-site
      - uses: actions/deploy-pages@v4
        id: deployment
