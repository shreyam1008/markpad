name: Flatpak offline build and smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 "/run/user/$(id -u)"
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils appstream desktop-file-utils xvfb xauth xdotool imagemagick tesseract-ocr xdg-desktop-portal-gtk openbox
          sudo flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.golang//25.08
          sudo flatpak install --system --noninteractive flathub org.flatpak.Builder
      - name: Verify runtime ABI
        run: dbus-run-session -- flatpak run --command=sh org.gnome.Sdk//50 -c 'pkg-config --modversion gtk+-3.0 webkit2gtk-4.1'
      - name: Download pinned sources then compile without network
        run: |
          dbus-run-session -- flatpak run org.flatpak.Builder --version
          dbus-run-session -- flatpak run org.flatpak.Builder --download-only build-flatpak packaging/flatpak/io.github.shreyam1008.markpad.yml
          dbus-run-session -- flatpak run org.flatpak.Builder --disable-download --compose-url-policy=full --mirror-screenshots-url=https://dl.flathub.org/media --repo=flatpak-repo build-flatpak packaging/flatpak/io.github.shreyam1008.markpad.yml
      - name: Validate exported metadata
        id: metadata
        run: |
          appstreamcli validate --no-net build-flatpak/files/share/metainfo/io.github.shreyam1008.markpad.metainfo.xml
          desktop-file-validate build-flatpak/files/share/applications/io.github.shreyam1008.markpad.desktop
          test ! -e build-flatpak/files/bin/bun
          flatpak build-bundle flatpak-repo quillpane.flatpak io.github.shreyam1008.markpad --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install and launch packaged app
        run: |
          flatpak install --user --noninteractive ./quillpane.flatpak
          # Only on the disposable runner: remove a portal left by build buses.
          # Keep the canonical runtime path, which Flatpak mounts in its sandbox.
          pkill -u "$(id -u)" -f '^/usr/libexec/xdg-document-portal$' || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          if mountpoint -q "$XDG_RUNTIME_DIR/doc"; then
            fusermount3 -u "$XDG_RUNTIME_DIR/doc"
          fi
          XDG_CURRENT_DESKTOP=XFCE xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash .github/scripts/flatpak-ui-smoke.sh
      - name: Upload window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quillpane-flatpak-evidence
          path: flatpak-evidence/
      - uses: actions/upload-artifact@v4
        if: always() && steps.metadata.outcome == 'success'
        with:
          name: quillpane-flatpak-test
          path: quillpane.flatpak
          if-no-files-found: error
      - name: Run official Flathub manifest and repository lints
        if: always() && steps.metadata.outcome == 'success'
        run: |
          dbus-run-session -- flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.shreyam1008.markpad.yml
          dbus-run-session -- flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak-repo
