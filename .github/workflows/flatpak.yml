name: Flatpak offline build and smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils appstream desktop-file-utils xvfb xauth xdotool imagemagick tesseract-ocr xdg-desktop-portal-gtk
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.golang//25.08
      - name: Verify runtime ABI
        run: flatpak run --command=sh org.gnome.Sdk//50 -c 'pkg-config --modversion gtk+-3.0 webkit2gtk-4.1'
      - name: Download pinned sources then compile without network
        run: |
          flatpak-builder --user --download-only build-flatpak packaging/flatpak/io.github.shreyam1008.markpad.yml
          flatpak-builder --user --disable-download --repo=flatpak-repo build-flatpak packaging/flatpak/io.github.shreyam1008.markpad.yml
      - name: Validate exported metadata
        run: |
          appstreamcli validate --no-net build-flatpak/files/share/metainfo/io.github.shreyam1008.markpad.metainfo.xml
          desktop-file-validate build-flatpak/files/share/applications/io.github.shreyam1008.markpad.desktop
          test ! -e build-flatpak/files/bin/bun
          flatpak build-bundle flatpak-repo quillpane.flatpak io.github.shreyam1008.markpad --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install and launch packaged app
        run: |
          flatpak install --user --noninteractive ./quillpane.flatpak
          XDG_CURRENT_DESKTOP=GNOME xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash .github/scripts/flatpak-ui-smoke.sh
      - name: Upload window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quillpane-flatpak-evidence
          path: flatpak-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: quillpane-flatpak-test
          path: quillpane.flatpak
          if-no-files-found: error
      - name: Run official Flathub manifest and repository lints
        run: |
          flatpak install --user --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.shreyam1008.markpad.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak-repo
