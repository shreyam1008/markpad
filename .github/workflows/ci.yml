name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Dpkg::Use-Pty=0 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev ripgrep \
            xvfb xauth xdotool xclip imagemagick tesseract-ocr
      - name: Install frontend dependencies
        run: make setup
      - name: Check, test, and build
        run: make check
      - name: Smoke-test the rendered Linux window
        run: bash .github/scripts/linux-ui-smoke.sh
      - name: Upload Linux UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-smoke
          path: |
            dist/linux-ui-smoke.log
            dist/linux-ui-smoke.txt
            dist/linux-ui-smoke.png
          if-no-files-found: ignore
