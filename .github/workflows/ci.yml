name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        run: go test ./...
      - name: Production tag test
        run: go test -tags "production,webkit2_41" ./...
      - name: Vet
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend syntax
        run: node --check frontend/src/main.js
      - name: Build
        run: go build -tags "production,webkit2_41" -trimpath -ldflags="-s -w" -o dist/markpad .
