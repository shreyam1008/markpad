name: Build Snap

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing the Snap packaging
        required: true
        default: main
      release_tag:
        description: Existing GitHub release tag to receive the artifact
        required: true
        default: v0.13.4
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Attach Snap and checksum to tagged release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="quillpane_${version}_amd64.snap"
          cp "${{ steps.snapcraft.outputs.snap }}" "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          gh release upload "$TAG" "$asset" "${asset}.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: quillpane-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
