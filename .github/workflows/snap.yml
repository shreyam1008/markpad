name: Build Snap
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag to build
        required: true
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Verify source version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 packaging/check-release-version.py
      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@v1
      - name: Verify packaged version and checksum
        env:
          TAG: ${{ inputs.release_tag }}
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          actual="$(unsquashfs -cat "$SNAP_PATH" meta/snap.yaml | sed -n "s/^version: *['\"]*\([^'\"]*\)['\"]*$/\1/p")"
          test "$actual" = "$version"
          mkdir -p snap-dist
          cp "$SNAP_PATH" "snap-dist/quillpane_${version}_amd64.snap"
          cd snap-dist
          sha256sum *.snap > "quillpane_${version}_amd64.snap.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: snap-dist/*
          if-no-files-found: error
