name: markpad
base: core24
version: '0.11.0'
summary: Small native Markdown notepad
description: |
  Markpad is a tiny native Markdown notepad built with Go and the system webview.
  No Electron, no cloud, and a small release binary.

  Features: folder workspaces, fast file switching, bounded workspace search,
  split view, version history, session restore, formatting toolbar, find in
  editor, favorites, word count, reading time, and keyboard shortcuts.

  Open any text file: Markdown, plain text, JSON, YAML, Python, Go, JS, HTML,
  CSS, and more.
grade: stable
confinement: strict
icon: packaging/linux/markpad.svg

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  markpad:
    command: bin/markpad
    extensions: [gnome]
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - browser-support

parts:
  markpad:
    plugin: go
    source: .
    build-snaps:
      - go/1.26/stable
    build-packages:
      - gcc
      - pkg-config
      - curl
      - unzip
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
    stage-packages:
      - libgtk-3-0t64
      - libwebkit2gtk-4.1-0
    build-environment:
      - CGO_ENABLED: "1"
    override-build: |
      BUN_VERSION="1.3.14"
      BUN_ARCHIVE="$CRAFT_PART_BUILD/bun-linux-x64.zip"
      curl --fail --location --retry 3 --output "$BUN_ARCHIVE" \
        "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
      echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  $BUN_ARCHIVE" | sha256sum --check --strict
      unzip -q "$BUN_ARCHIVE" -d "$CRAFT_PART_BUILD"
      BUN="$CRAFT_PART_BUILD/bun-linux-x64/bun"
      (cd frontend && "$BUN" install --frozen-lockfile && "$BUN" run build)
      go build -tags "production,webkit2_41" -trimpath -ldflags="-s -w" -o $CRAFT_PART_INSTALL/bin/markpad .

  desktop-entry:
    plugin: dump
    source: .
    organize:
      packaging/linux/markpad.desktop: share/applications/markpad.desktop
      packaging/linux/markpad.svg: share/icons/hicolor/scalable/apps/markpad.svg
      packaging/linux/io.github.markpad.metainfo.xml: share/metainfo/io.github.markpad.metainfo.xml
    stage:
      - share/applications/markpad.desktop
      - share/icons/hicolor/scalable/apps/markpad.svg
      - share/metainfo/io.github.markpad.metainfo.xml
